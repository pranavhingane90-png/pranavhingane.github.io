<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#000428,#004e92,#000000);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
color:white;
overflow-x:hidden;
}

/* BACKGROUND ANIMATION */

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEADER */

header{
text-align:center;
padding:70px 20px;
animation:fadeIn 1.5s ease;
}

header h1{
font-size:55px;
background:linear-gradient(to right,#00e5ff,#00ff95);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

.highlight{
color:#00ffae;
font-weight:bold;
}

header p{
font-size:18px;
opacity:0.9;
}

/* TOP BUTTONS */

.top-tools{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:20px;
margin-bottom:20px;
}

/* SEARCH */

.search-box{
text-align:center;
margin:30px;
}

.search-box input{
padding:15px;
width:340px;
border-radius:40px;
border:none;
outline:none;
font-size:16px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
color:white;
box-shadow:0 0 15px rgba(0,255,255,0.3);
}

.search-box input::placeholder{
color:#ddd;
}

/* PROJECTS */

.projects{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:25px;
}

/* CARD */

.card{
width:280px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border-radius:20px;
padding:18px;
transition:0.4s;
box-shadow:0 0 25px rgba(0,0,0,0.4);
position:relative;
overflow:hidden;
animation:slideUp 0.8s ease;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
background:rgba(255,255,255,0.15);
box-shadow:0 0 35px rgba(0,255,255,0.4);
}

.card img{
width:100%;
border-radius:15px;
margin-bottom:12px;
}

.card h3{
font-size:20px;
margin-bottom:8px;
}

.card p{
font-size:14px;
line-height:1.5;
}

.price{
color:#00ff95;
font-size:22px;
font-weight:bold;
margin-top:10px;
}

/* BUTTONS */

button{
padding:10px 15px;
border:none;
border-radius:10px;
margin:5px 3px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
font-size:14px;
}

button:hover{
transform:scale(1.08);
}

.detailsBtn{
background:linear-gradient(45deg,#00bcd4,#2196f3);
color:white;
}

.buyBtn{
background:linear-gradient(45deg,#25D366,#128C7E);
color:white;
}

.locationBtn{
background:linear-gradient(45deg,#ff9800,#ff5722);
color:white;
}

.adminBtn{
background:linear-gradient(45deg,#9c27b0,#673ab7);
color:white;
}

.contactBtn{
background:linear-gradient(45deg,#ff1744,#ff9100);
color:white;
}

/* ADMIN PANEL */

.admin-panel{
background:rgba(255,255,255,0.08);
padding:25px;
text-align:center;
display:none;
margin:20px auto;
width:80%;
border-radius:20px;
backdrop-filter:blur(15px);
}

.admin-panel input{
padding:12px;
margin:8px;
border:none;
border-radius:10px;
width:250px;
}

/* QUIZ POPUP */

.quiz-popup{
display:none;
position:fixed;
z-index:9999;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(10px);
justify-content:center;
align-items:center;
overflow:auto;
padding:20px;
}

.quiz-box{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:25px;
width:90%;
max-width:600px;
backdrop-filter:blur(20px);
box-shadow:0 0 30px rgba(0,255,255,0.3);
animation:slideUp 0.5s ease;
text-align:center;
}

.quiz-box p{
font-size:18px;
margin-top:20px;
}

.quiz-box button{
margin:8px;
}

.close-btn{
position:absolute;
right:30px;
top:20px;
font-size:35px;
cursor:pointer;
color:white;
}

/* FOOTER */

footer{
text-align:center;
padding:25px;
background:rgba(0,0,0,0.8);
margin-top:50px;
font-size:14px;
}

/* ANIMATIONS */

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes slideUp{
from{
transform:translateY(40px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

</style>
